<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TriFact review</title>
<style>
:root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --card:#fff; --line:#e7e5e4; --acc:#2563eb; --ok:#15803d; --bad:#b91c1c; --warn:#b45309; --sel:#dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --card:#292524; --line:#44403c; --acc:#60a5fa; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; --sel:#1e3a5f; } }
* { box-sizing:border-box; }
body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
header { position:sticky; top:0; z-index:2; background:var(--card); border-bottom:1px solid var(--line); padding:8px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
header h1 { font-size:16px; margin:0 12px 0 0; }
input, select, textarea, button { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
button { cursor:pointer; }
button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
button.accept { background:var(--ok); color:#fff; border-color:var(--ok); }
main { max-width:1120px; margin:0 auto; padding:16px; }
.bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; flex:1 1 140px; }
.bar > div { height:100%; background:var(--ok); }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
.meta { color:var(--muted); font-size:13px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:8px; }
.badge { padding:1px 7px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid; }
.unc-low { color:var(--ok); border-color:var(--ok); background:#15803d14; }
.unc-medium { color:var(--warn); border-color:var(--warn); background:#b4530914; }
.unc-high { color:var(--bad); border-color:var(--bad); background:#b91c1c14; }
.text { white-space:pre-wrap; word-break:break-word; font-size:16px; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; }
.pair { display:grid; grid-template-columns:1fr; gap:8px; }
@media (min-width:760px) { .pair { grid-template-columns:1fr 1fr; } }
.lbl { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
.ent { border-radius:4px; padding:0 3px; border:1px solid; }
.PER { border-color:#9333ea; background:#9333ea22; } .ORG { border-color:#0891b2; background:#0891b222; } .LOC { border-color:#ca8a04; background:#ca8a0422; }
.ent sub { font-size:10px; color:var(--muted); }
.machine { margin-top:10px; border-left:3px solid var(--warn); padding:8px 12px; font-size:14px; background:var(--bg); border-radius:0 6px 6px 0; }
.machine .tag { font-weight:600; }
.choices { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.choices button.on { outline:2px solid var(--acc); background:var(--sel); }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px; }
.row label { font-size:13px; color:var(--muted); }
textarea { width:100%; min-height:44px; }
.counts input { width:64px; }
.hint { color:var(--muted); font-size:13px; }
.nav { display:flex; gap:8px; justify-content:space-between; flex-wrap:wrap; align-items:center; }
.warn { color:var(--bad); font-weight:600; }
kbd { border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 4px; font-size:12px; }
table.list { width:100%; border-collapse:collapse; font-size:13px; }
table.list th, table.list td { border-bottom:1px solid var(--line); padding:8px 6px; text-align:left; vertical-align:top; }
table.list tr:hover { background:var(--sel); }
.clip { max-width:340px; max-height:90px; overflow:auto; white-space:pre-wrap; word-break:break-word; }
</style>
</head>
<body>
<header>
  <a id="hublink" href="/" style="display:none;text-decoration:none;font-weight:600;color:var(--acc)">← Хаб</a>
  <h1 id="title">Review</h1>
  <input id="reviewer" placeholder="Ваше имя (обязательно)" size="20">
  <select id="filter">
    <option value="cal_todo">выборка калибровки ADR-0026 (осталось)</option>
    <option value="cal_all">выборка калибровки ADR-0026 (все)</option>
    <option value="p1">все 5 600: сначала спорные (priority 1)</option>
    <option value="todo">все неразмеченные</option>
    <option value="todo_high">неразмеченные: высокая неопределённость</option>
    <option value="todo_medium">неразмеченные: средняя неопределённость</option>
    <option value="todo_low">неразмеченные: высокая уверенность (low)</option>
    <option value="all">все элементы</option>
  </select>
  <select id="lang"><option value="">все языки</option></select>
  <select id="mode"><option value="card">Карточка</option><option value="table">Таблица (25)</option><option value="table50">Таблица (50)</option><option value="table100">Таблица (100)</option></select>
  <label class="hint"><input type="checkbox" id="blind"> скрыть подсказку</label>
  <div class="bar"><div id="progress"></div></div>
  <span id="count" class="hint"></span>
  <span id="savestatus" class="hint" style="display:none"></span>
  <button id="savebtn" class="primary" style="display:none">Сохранить</button>
  <button id="export">Экспорт CSV</button>
  <label class="hint"><input type="file" id="import" accept=".csv" style="display:none"><span style="cursor:pointer;text-decoration:underline" onclick="document.getElementById('import').click()">загрузить CSV</span></label>
</header>
<main>
  <div class="card hint" id="help"></div>
  <div id="item"></div>
  <div class="nav"><button id="prev">← назад <kbd>K</kbd></button><span id="pos" class="hint"></span><button id="next">вперёд <kbd>J</kbd> →</button></div>
</main>
<script id="data" type="application/json">__DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const KEY = "trifact-review:" + D.sheet + ":" + D.version;
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { S = {}; }
const items = D.items;
const IS_HTTP = location.protocol.startsWith("http");
let pageSize = 25;
let order = items.map((_, i) => i), pos = 0, page = 0;
let saveTimer = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (IS_HTTP) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => syncServer(false), 600);
  }
}
async function syncServer(explicit) {
  if (!IS_HTTP) return;
  const who = ($("reviewer").value || "").trim();
  if (!who) {
    if (explicit) { alert("Укажите ваше имя вверху страницы."); $("reviewer").focus(); }
    else $("savestatus").textContent = "введите имя для автосохранения";
    return;
  }
  if (/llm|claude|gpt|qwen|machine|auto|model/i.test(who)) {
    if (explicit) alert("Имя проверяющего должно быть именем человека.");
    return;
  }
  $("savestatus").textContent = "сохранение...";
  try {
    const res = await fetch("/api/save/" + D.sheet, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ reviewer: who, state: S }),
    });
    const j = await res.json();
    if (j.ok) $("savestatus").textContent = `✓ сохранено (${j.confirmed}/${j.total})`;
    else $("savestatus").textContent = "ошибка: " + (j.error || "save");
  } catch (e) {
    $("savestatus").textContent = "ошибка связи с сервером";
  }
}
if (IS_HTTP) {
  $("hublink").style.display = "inline";
  $("savestatus").style.display = "inline";
  $("savebtn").style.display = "inline-block";
  $("savebtn").onclick = () => syncServer(true);
}
function st(it) { return S[it.id] || (S[it.id] = {}); }
function done(it) { const s = S[it.id]; return !!(s && D.done(s)); }
D.done = { quality: (s) => s.label === "good" || s.label === "bad",
           eval: (s) => ["ok", "fix", "drop"].includes(s.verdict) && (s.verdict !== "fix" || (s.fixed_text || s.fixed_source)),
           ner: (s) => s.checked === true }[D.kind];
$("title").textContent = D.title;
$("help").innerHTML = D.help + `<br><span class="hint">Горячие клавиши: <kbd>A</kbd> принять рекомендацию машины (после проверки), <kbd>J</kbd>/<kbd>K</kbd> навигация. Машинные оценки явно помечены и никогда не считаются человеческой проверкой без вашего подтверждения.</span>`;
$("reviewer").value = S.__reviewer || "";
$("reviewer").oninput = (e) => { S.__reviewer = e.target.value; save(); };
$("blind").checked = !!S.__blind;
$("blind").onchange = (e) => { S.__blind = e.target.checked; save(); render(); };
[...new Set(items.map((x) => x.lang))].sort().forEach((l) => { const o = document.createElement("option"); o.value = l; o.textContent = l; $("lang").appendChild(o); });

function inCal(it) {
  const v = it.m && it.m.in_calibration_sample;
  return v === true || v === "true" || v === "True" || v === 1;
}
function reorder() {
  const f = $("filter").value, lg = $("lang").value;
  order = items.map((_, i) => i).filter((i) => {
    const it = items[i], u = (it.m && it.m.uncertainty) || "medium";
    if (lg && it.lang !== lg) return false;
    if (f === "cal_todo") return inCal(it) && !done(it);
    if (f === "cal_all") return inCal(it);
    if (f === "todo") return !done(it);
    if (f === "todo_high") return !done(it) && u === "high";
    if (f === "todo_medium") return !done(it) && u === "medium";
    if (f === "todo_low") return !done(it) && u === "low";
    return true;
  });
  if (f === "p1" || f === "cal_todo" || f === "cal_all") {
    const rank = { high: 0, medium: 1, low: 2 };
    order.sort((a, b) => (rank[items[a].m.uncertainty] ?? 1) - (rank[items[b].m.uncertainty] ?? 1) || a - b);
  }
  pos = Math.min(pos, Math.max(order.length - 1, 0));
  page = Math.min(page, Math.max(Math.ceil(order.length / pageSize) - 1, 0));
}
$("filter").onchange = () => { pos = 0; page = 0; reorder(); render(); };
$("lang").onchange = () => { pos = 0; page = 0; reorder(); render(); };
$("mode").onchange = () => {
  const m = $("mode").value;
  pageSize = m === "table100" ? 100 : m === "table50" ? 50 : 25;
  page = 0;
  render();
};

function marked(t) {
  return esc(t).replace(/\[([^\[\]|]+)\|(PER|ORG|LOC)\]/g, (_, s, ty) => `<span class="ent ${ty}">${s}<sub>${ty}</sub></span>`);
}
function uncBadge(m) {
  if ($("blind").checked || !m || !m.uncertainty) return "";
  const u = m.uncertainty;
  const lbl = { low: "низкая неопред.", medium: "средняя неопред.", high: "высокая неопред." }[u] || u;
  return `<span class="badge unc-${esc(u)}">${lbl}</span>${m.uncertainty_reasons ? `<span class="hint">(${esc(m.uncertainty_reasons)})</span>` : ""}`;
}
function machineBox(it) {
  if ($("blind").checked) return "";
  const m = it.m || {};
  return `<div class="machine"><span class="tag">Рекомендация машины</span> (${esc(D.labeler)}): ${D.machineHtml(m, it)}<br><span class="hint">Это не человеческая метка: решение принимаете вы.</span></div>`;
}
D.machineHtml = {
  quality: (m) => `<b>${esc(m.judge_label || "—")}</b> · ${esc(m.judge_category)} · ${esc(m.judge_reason)}<br>GlotLID: ${esc(m.glotlid_lang)} ${esc(m.glotlid_score)}; lid.176: ${esc(m.lid176_lang)} ${esc(m.lid176_score)}; доля каз. букв: ${esc(m.kk_letter_share)}`,
  eval: (m) => `<b>${esc(m.judge_verdict || "—")}</b> · ${esc(m.judge_reason)}${m.judge_fixed_text ? `<br>исправление: <i>${esc(m.judge_fixed_text)}</i>` : ""}${m.judge_fixed_source ? `<br>испр. посылка: <i>${esc(m.judge_fixed_source)}</i>` : ""}<br>bge-m3 cos ${esc(m.cos_source)}${m.cos_premise !== "" && m.cos_premise != null ? `, посылка ${esc(m.cos_premise)}` : ""}; chrF ${esc(m.chrf_back !== "" && m.chrf_back != null ? m.chrf_back : "—")}; цифры: ${m.digits_kept ? "да" : "нет"}${m.nli_kk ? `; NLI kk ${esc(m.nli_kk)} / en ${esc(m.nli_en)}` : ""}`,
  ner: (m) => `ошибок по судье: <b>${esc(m.machine_errors ?? "—")}</b> (тип ${esc(m.judge_wrong_type ?? 0)}, границы ${esc(m.judge_wrong_span ?? 0)}, не сущн. ${esc(m.judge_not_entity ?? 0)}, пропущ. ${esc(m.judge_missed ?? 0)}) · ${esc(m.judge_reason)}${m.judge_wrong_type_items ? `<br>тип: ${esc(m.judge_wrong_type_items)}` : ""}${m.judge_wrong_span_items ? `<br>границы: ${esc(m.judge_wrong_span_items)}` : ""}${m.judge_not_entity_items ? `<br>не сущность: ${esc(m.judge_not_entity_items)}` : ""}${m.judge_missed_items ? `<br>пропущено: ${esc(m.judge_missed_items)}` : ""}<br>GLiNER: только у GLiNER — ${esc(m.gliner_only || "нет")}; другой тип — ${esc(m.gliner_type_diff || "нет")}; другие границы — ${esc(m.gliner_boundary_diff || "нет")}`,
}[D.kind];

function acceptMachine(it, advance) {
  if ($("blind").checked) return;
  const m = it.m || {}, s = st(it);
  if (D.kind === "quality") {
    if (m.judge_label !== "good" && m.judge_label !== "bad") return;
    s.label = m.judge_label;
  } else if (D.kind === "eval") {
    if (!["ok", "fix", "drop"].includes(m.judge_verdict)) return;
    s.verdict = m.judge_verdict;
    if (m.judge_verdict === "fix") {
      s.fixed_text = m.judge_fixed_text || "";
      s.fixed_source = m.judge_fixed_source || "";
      s.took_machine_fix = true;
    }
  } else if (D.kind === "ner") {
    s.wrong_type = Number(m.judge_wrong_type || 0);
    s.wrong_span = Number(m.judge_wrong_span || 0);
    s.not_entity = Number(m.judge_not_entity || 0);
    s.missed = Number(m.judge_missed || 0);
    s.checked = true;
  }
  touch(it);
  if (advance && pos < order.length - 1) pos++;
  render();
}

function choice(name, val, label, key, cur) { return `<button data-k="${name}" data-v="${val}" class="${cur === val ? "on" : ""}">${label} <kbd>${key}</kbd></button>`; }
function body(it) {
  const s = st(it), r = it.r, m = it.m || {};
  const accBtn = !$("blind").checked ? `<button id="accept" class="accept">✓ Принять рекомендацию <kbd>A</kbd></button>` : "";
  if (D.kind === "quality") return `<div class="text">${esc(r.text)}</div>${machineBox(it)}
    <div class="choices">${accBtn}${choice("label", "good", "good — естественный текст", "G", s.label)}${choice("label", "bad", "bad — мусор / не тот язык", "B", s.label)}</div>
    <div class="row"><label>заметка</label><input data-f="note" value="${esc(s.note)}" style="flex:1"></div>`;
  if (D.kind === "eval") {
    const nli = r.kind === "nli_translation";
    return `${nli && r.en_premise ? `<div class="pair"><div><div class="lbl">EN посылка (оригинал)</div><div class="text">${esc(r.en_premise)}</div></div><div><div class="lbl">EN гипотеза (оригинал)</div><div class="text">${esc(r.en_hypothesis)}</div></div></div><p class="hint">Метка: <b>${esc(r.label)}</b></p>` : ""}
    <div class="pair"><div><div class="lbl">${nli ? "kk посылка (перевод)" : "исходный запрос"}</div><div class="text">${esc(r.source_text)}</div></div>
    <div><div class="lbl">${nli ? "kk гипотеза (перевод)" : "перевод (" + esc(r.direction.split("-")[0]) + ")"}</div><div class="text">${esc(r.candidate_text)}</div></div></div>${machineBox(it)}
    <div class="choices">${accBtn}${choice("verdict", "ok", "ok", "O", s.verdict)}${choice("verdict", "fix", "fix — исправить", "F", s.verdict)}${choice("verdict", "drop", "drop — удалить", "D", s.verdict)}</div>
    ${s.verdict === "fix" ? `<div class="row" style="display:block"><label>${nli ? "исправленная гипотеза (пусто — без изменений)" : "исправленный перевод"}</label><textarea data-f="fixed_text">${esc(s.fixed_text)}</textarea>
    ${nli ? `<label>исправленная посылка (пусто — без изменений)</label><textarea data-f="fixed_source">${esc(s.fixed_source)}</textarea>` : ""}
    ${!$("blind").checked && (m.judge_fixed_text || m.judge_fixed_source) ? `<button id="takefix">взять вариант машины в поле (проверьте!)</button>` : ""}</div>` : ""}
    <div class="row"><label>заметка</label><input data-f="note" value="${esc(s.note)}" style="flex:1"></div>`;
  }
  return `<div class="text">${marked(r.text)}</div><p class="hint">Размечено сущностей: ${esc(r.entities)}. Укажите число ошибок (0, если ошибок нет), затем «проверено» <kbd>Enter</kbd>.</p>${machineBox(it)}
    <div class="row counts">${["wrong_type:неверный тип", "wrong_span:неверные границы", "not_entity:не сущность", "missed:пропущено"].map((x) => { const [f, l] = x.split(":"); return `<label>${l}</label><input type="number" min="0" data-f="${f}" value="${esc(s[f] ?? 0)}">`; }).join("")}</div>
    <div class="choices">${accBtn}<button data-k="checked" data-v="true" class="${s.checked ? "on" : ""}">проверено <kbd>Enter</kbd></button></div>
    <div class="row"><label>заметка</label><input data-f="note" value="${esc(s.note)}" style="flex:1"></div>`;
}

function isTableMode() { return $("mode").value.startsWith("table"); }
function renderTable() {
  const start = page * pageSize, slice = order.slice(start, start + pageSize);
  const pages = Math.max(1, Math.ceil(order.length / pageSize));
  $("pos").textContent = `стр. ${page + 1} / ${pages} (${order.length} эл.)`;
  const rowsHtml = slice.map((idx, k) => {
    const it = items[idx], m = it.m || {}, r = it.r;
    const content = D.kind === "quality"
      ? `<div class="clip">${esc((r.text || "").slice(0, 260))}</div>`
      : D.kind === "ner"
      ? `<div class="clip">${marked(r.text)}</div>`
      : `<div class="clip"><b>Src:</b> ${esc(r.source_text)}<br><b>Cand:</b> ${esc(r.candidate_text)}${m.judge_fixed_text ? `<br><b>Fix:</b> <i>${esc(m.judge_fixed_text)}</i>` : ""}</div>`;
    const rec = D.kind === "quality" ? `<b>${esc(m.judge_label)}</b> (${esc(m.judge_category)})`
      : D.kind === "ner" ? `err=${esc(m.machine_errors)} (t:${esc(m.judge_wrong_type)} s:${esc(m.judge_wrong_span)} n:${esc(m.judge_not_entity)} m:${esc(m.judge_missed)})`
      : `<b>${esc(m.judge_verdict)}</b>`;
    return `<tr>
      <td><a href="#" data-open="${start + k}">${esc(it.lang)}</a><br>${uncBadge(m)}</td>
      <td>${content}</td>
      <td>${rec}<br><span class="hint">${esc((m.judge_reason || "").slice(0, 140))}</span></td>
      <td>${done(it) ? `<span style="color:var(--ok)">✓</span>` : `<button data-tacc="${idx}" class="accept">✓ Подтвердить</button>`}</td>
    </tr>`;
  }).join("");
  const batchBtn = !$("blind").checked && slice.some((idx) => !done(items[idx]))
    ? `<div style="margin-bottom:10px;display:flex;gap:10px;align-items:center;"><button id="accept-page" class="accept">✓ Я проверил(а) все строки на этой странице — подтвердить рекомендации (${slice.filter((i) => !done(items[i])).length})</button><span class="hint">Подтверждает только видимые на экране строки.</span></div>`
    : "";
  $("item").innerHTML = `<div class="card">${batchBtn}<table class="list"><thead><tr><th>Язык / Риск</th><th>Контент</th><th>Рекомендация и обоснование</th><th>Действие</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>`;
  document.querySelectorAll("[data-open]").forEach((a) => a.onclick = (e) => { e.preventDefault(); pos = Number(a.dataset.open); $("mode").value = "card"; render(); });
  document.querySelectorAll("[data-tacc]").forEach((b) => b.onclick = () => acceptMachine(items[Number(b.dataset.tacc)], false));
  const ap = $("accept-page");
  if (ap) ap.onclick = () => {
    const who = ($("reviewer").value || "").trim();
    if (!who) { alert("Сначала укажите ваше имя вверху страницы."); $("reviewer").focus(); return; }
    for (const idx of slice) { if (!done(items[idx])) acceptMachine(items[idx], false); }
    render();
  };
}

function render() {
  const calItems = items.filter(inCal);
  const f = $("filter").value;
  const scope = (f === "cal_todo" || f === "cal_all") && calItems.length ? calItems : items;
  const n = scope.filter(done).length;
  $("progress").style.width = (100 * n / Math.max(scope.length, 1)) + "%";
  $("count").textContent = `${n} / ${scope.length} размечено`;
  if (!order.length) { $("item").innerHTML = `<div class="card">Нет элементов под фильтр.</div>`; $("pos").textContent = ""; return; }
  if (isTableMode()) { renderTable(); return; }
  const it = items[order[pos]];
  $("pos").textContent = `${pos + 1} / ${order.length}`;
  const m = it.m || {};
  $("item").innerHTML = `<div class="card"><div class="meta"><span>${esc(it.id)}</span><span>язык: ${esc(it.lang)}</span>${it.r.direction ? `<span>направление: ${esc(it.r.direction)}</span>` : ""}${it.r.stratum ? `<span>${esc(it.r.stratum)}</span>` : ""}${uncBadge(m)}${done(it) ? `<span style="color:var(--ok)">✓ размечено</span>` : ""}</div>${body(it)}</div>`;
  document.querySelectorAll("[data-k]").forEach((b) => b.onclick = () => set(it, b.dataset.k, b.dataset.v));
  document.querySelectorAll("[data-f]").forEach((el) => el.oninput = () => { st(it)[el.dataset.f] = el.type === "number" ? Number(el.value) : el.value; touch(it); });
  const tf = $("takefix"); if (tf) tf.onclick = () => { const s = st(it); s.fixed_text = s.fixed_text || m.judge_fixed_text; s.fixed_source = s.fixed_source || m.judge_fixed_source; s.took_machine_fix = true; touch(it); render(); };
  const ac = $("accept"); if (ac) ac.onclick = () => acceptMachine(it, true);
}
function touch(it) { const s = st(it); s.assist = $("blind").checked ? "blind" : "machine_shown"; s.at = new Date().toISOString(); save(); }
function set(it, k, v) {
  const s = st(it);
  s[k] = v === "true" ? true : v;
  touch(it);
  const advance = D.kind === "quality" || (D.kind === "eval" && v !== "fix") || (D.kind === "ner" && k === "checked");
  if (advance && pos < order.length - 1) pos++;
  render();
}
document.addEventListener("keydown", (e) => {
  if (isTableMode()) return;
  if (["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) { if (e.key === "Escape") document.activeElement.blur(); if (!(D.kind === "ner" && e.key === "Enter")) return; }
  const it = items[order[pos]]; if (!it) return;
  const k = e.key.toLowerCase();
  if (k === "j" || e.key === "ArrowRight") { if (pos < order.length - 1) pos++; render(); }
  else if (k === "k" || e.key === "ArrowLeft") { if (pos > 0) pos--; render(); }
  else if (k === "a" && !$("blind").checked) acceptMachine(it, true);
  else if (D.kind === "quality" && (k === "g" || k === "b")) set(it, "label", k === "g" ? "good" : "bad");
  else if (D.kind === "eval" && "ofd".includes(k) && k) set(it, "verdict", {o: "ok", f: "fix", d: "drop"}[k]);
  else if (D.kind === "ner" && e.key === "Enter") { e.preventDefault(); set(it, "checked", "true"); }
});
$("prev").onclick = () => { if (isTableMode()) { if (page > 0) page--; } else if (pos > 0) pos--; render(); };
$("next").onclick = () => { if (isTableMode()) { if ((page + 1) * pageSize < order.length) page++; } else if (pos < order.length - 1) pos++; render(); };
function csvCell(v) { v = v == null ? "" : String(v); return /[",\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; }
$("export").onclick = () => {
  const who = ($("reviewer").value || "").trim();
  if (!who) { alert("Укажите имя проверяющего: без него разметка не считается человеческой."); $("reviewer").focus(); return; }
  if (/llm|claude|gpt|qwen|machine|auto/i.test(who)) { alert("Имя проверяющего должно быть именем человека."); return; }
  const rows = [D.columns.join(",")];
  for (const it of items) {
    const s = S[it.id] || {}, r = { ...it.r };
    if (done(it)) D.fill(r, s, who);
    rows.push(D.columns.map((c) => csvCell(r[c])).join(","));
  }
  const blob = new Blob(["\ufeff" + rows.join("\r\n") + "\r\n"], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = D.export_name; a.click();
};
D.fill = {
  quality: (r, s, who) => { r.label = s.label; r.note = s.note || ""; r.reviewer = who; r.assist = s.assist || ""; r.reviewed_at = s.at || ""; },
  eval: (r, s, who) => { r.verdict = s.verdict; r.fixed_text = s.verdict === "fix" ? (s.fixed_text || "") : ""; r.fixed_source = s.verdict === "fix" ? (s.fixed_source || "") : ""; r.reviewer = who; r.note = s.note || ""; r.assist = s.assist || ""; r.took_machine_fix = s.took_machine_fix ? "true" : ""; r.reviewed_at = s.at || ""; },
  ner: (r, s, who) => { for (const f of ["wrong_type", "wrong_span", "not_entity", "missed"]) r[f] = String(s[f] ?? 0); r.reviewer = who; r.note = s.note || ""; r.assist = s.assist || ""; r.reviewed_at = s.at || ""; },
}[D.kind];
$("import").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  const text = (await f.text()).replace(/^\ufeff/, "");
  const recs = parseCsv(text), head = recs.shift(), idc = head.indexOf(D.id_col);
  let n = 0;
  for (const rec of recs) {
    const o = Object.fromEntries(head.map((h, i) => [h, rec[i]]));
    const id = rec[idc]; if (!id || !items.some((x) => x.id === id)) continue;
    const s = st({ id });
    if (D.kind === "quality" && o.label) { s.label = o.label; s.note = o.note; n++; }
    if (D.kind === "eval" && o.verdict) { s.verdict = o.verdict; s.fixed_text = o.fixed_text; s.fixed_source = o.fixed_source; s.note = o.note; n++; }
    if (D.kind === "ner" && o.reviewer) { for (const k of ["wrong_type", "wrong_span", "not_entity", "missed"]) s[k] = Number(o[k] || 0); s.checked = true; s.note = o.note; n++; }
    if (o.reviewer && !S.__reviewer) { S.__reviewer = o.reviewer; $("reviewer").value = o.reviewer; }
  }
  save(); reorder(); render(); alert(`Загружено ${n} размеченных строк.`);
};
function parseCsv(t) {
  const out = []; let row = [], cur = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && t[i + 1] === "\n") i++; row.push(cur); out.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); out.push(row); }
  return out.filter((r) => r.length > 1 || r[0]);
}
reorder(); render();
if (IS_HTTP) {
  fetch("/api/state/" + D.sheet).then((r) => r.json()).then((srv) => {
    let changed = false;
    for (const [k, v] of Object.entries(srv || {})) {
      if (k === "__reviewer" && !S.__reviewer && v) { S.__reviewer = v; $("reviewer").value = v; changed = true; }
      else if (!k.startsWith("__") && !S[k]) { S[k] = v; changed = true; }
    }
    if (changed) { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} reorder(); render(); }
    const n = items.filter(done).length;
    $("savestatus").textContent = n ? `✓ синхронизировано (${n}/${items.length})` : "готово к автосохранению";
  }).catch(() => {});
}
</script>
