global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: inference
    static_configs: [{targets: ["inference:8001"]}]
  - job_name: worker
    static_configs: [{targets: ["worker:9100"]}]
  - job_name: llm
    static_configs: [{targets: ["llm:8080"]}]
  - job_name: qdrant
    static_configs: [{targets: ["qdrant:6333"]}]
