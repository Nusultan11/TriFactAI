apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
  - name: TriFact Postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: trifact
    jsonData: {database: trifact, sslmode: disable}
    secureJsonData: {password: trifact}
