# Offline ML pipeline; see docs/architecture/docs/01-architecture.md §5.3 and §9.
# Batch jobs (trifact.batch.*) are sharded and idempotent and may run on a cloud GPU (ADR-0014).
stages:
  # ------------------------------------------------ stage 1: acquisition
  acquire:   # resumable: outs are persistent, finished files are skipped on re-run (ADR-0017)
    foreach: [wikipedia, fineweb2_kk, multidomain_kk, kazparc, kaznerd, wikiann, wikineural, nerel,
              squad_v2, sberquad, kazqad, ms_marco, mmarco_ru, miracl, miracl_corpus, ru_hnp, xnli]
    do:
      cmd: python -m trifact.data.acquire --source ${item}
      deps: [src/trifact/data/acquire.py, src/trifact/lake]
      params: ["sources.${item}", lake]
      outs: [{"data/raw/${item}": {persist: true}}]

  wikidata:
    cmd: python -m trifact.data.wikidata
    deps: [src/trifact/data/wikidata.py, src/trifact/lake]
    params: [sources.wikidata, lake]
    outs: [{data/raw/wikidata: {persist: true}}]

  wikitext:  # Wikipedia XML dumps with links, for silver NER (ADR-0015)
    cmd: python -m trifact.data.wikitext
    deps: [src/trifact/data/wikitext.py, src/trifact/data/wikidata.py, src/trifact/lake]
    params: [sources.wikipedia_wikitext, lake]
    outs: [{data/raw/wikipedia_wikitext: {persist: true}}]

  # ------------------------------------------------ stage 2: curation
  # Curation stages are resumable (fingerprinted output, finished shards kept, ADR-0014): outs are
  # persistent so that an interrupted `dvc repro` continues instead of starting over.
  eval_langid:   # lid.176 vs GlotLID on the reviewed paragraph sample (ROADMAP 2.2)
    cmd: python -m trifact.evaluation.eval_langid score
    deps: [src/trifact/evaluation/eval_langid.py, src/trifact/ingestion/langdetect.py, data/review/langid]
    params: [curation.langid, evaluation.bootstrap_samples, seed]
    metrics: [{reports/langid.json: {cache: false}}]

  clean:
    cmd: python -m trifact.data.clean
    deps: [src/trifact/data/clean.py, src/trifact/data/quality.py, src/trifact/data/curation.py,
           src/trifact/ingestion/normalize.py, src/trifact/ingestion/langdetect.py, src/trifact/lake,
           data/raw/wikipedia, data/raw/fineweb2_kk, data/raw/multidomain_kk]
    params: [curation.langid, curation.quality, curation.boilerplate, curation.dropped_text_chars,
             curation.domains, curation.sources, scale.full.corpus_docs, lake]
    outs: [{data/clean: {persist: true}}]
    metrics: [{reports/clean.json: {cache: false}}]

  dedup:
    cmd: python -m trifact.data.dedup
    deps: [src/trifact/data/dedup.py, src/trifact/data/hashing.py, src/trifact/data/curation.py, src/trifact/lake,
           data/clean]
    params: [curation.minhash, curation.sources, lake, seed]
    outs: [{data/curated/dedup: {persist: true}}]
    metrics: [{reports/dedup.json: {cache: false}}]

  decontaminate:
    cmd: python -m trifact.data.decontaminate
    deps: [src/trifact/data/decontaminate.py, src/trifact/data/hashing.py, src/trifact/data/curation.py,
           src/trifact/ingestion/normalize.py, src/trifact/lake, data/curated/dedup,
           data/raw/kazqad, data/raw/sberquad, data/raw/squad_v2, data/raw/xnli, data/raw/kaznerd,
           data/raw/wikiann, data/raw/wikineural, data/raw/nerel, data/raw/miracl, data/raw/miracl_corpus]
    params: [curation.decontamination, lake]
    outs: [{data/curated/corpus: {persist: true}}]
    metrics: [{reports/decontamination.json: {cache: false}}]

  corpus_stats:  # lengths, languages, domains, tokenizer fertility (ROADMAP 2.6)
    cmd: python -m trifact.data.corpus_stats
    deps: [src/trifact/data/corpus_stats.py, data/curated/corpus]
    params: [curation.stats, seed]
    metrics: [{reports/corpus_stats.json: {cache: false}}]

  eda:       # full-volume EDA of every layer (ROADMAP 2.6); entities = Wikidata
    foreach:
      raw: data/raw
      clean: data/clean
      curated: data/curated
      entities: data/raw/wikidata
    do:
      cmd: python -m trifact.data.eda ${key}
      deps: [src/trifact/data/eda.py, "${item}"]
      params: [curation.workers, seed]
      outs: ["reports/eda/${key}.json"]

  eda_report:
    cmd: python -m trifact.data.eda_report
    deps: [src/trifact/data/eda_report.py, src/trifact/data/task_eda.py, reports/eda/raw.json, reports/eda/clean.json,
           reports/eda/curated.json, reports/eda/entities.json, reports/eda/task.json, reports/corpus_stats.json]
    outs: [reports/eda/report.md, reports/eda/figures, reports/eda/findings.json]

  # ------------------------------------------------ stage 3: task datasets
  # GPU work runs in Colab or Kaggle (ADR-0025); these stages import the historical pinned Kaggle outputs.
  validate:
    cmd: python -m trifact.data.validate
    deps: [src/trifact/data/validate.py, src/trifact/data/task_common.py, configs/labels.yaml, data/raw/kaznerd,
           data/raw/wikiann, data/raw/wikineural, data/raw/nerel, data/raw/squad_v2, data/raw/sberquad, data/raw/kazqad,
           data/raw/xnli, data/raw/miracl, data/raw/miracl_corpus]
    metrics: [{reports/data_quality.json: {cache: false}}]

  split:
    cmd: python -m trifact.data.split
    deps: [src/trifact/data/split.py, src/trifact/data/task_common.py, reports/data_quality.json]
    params: [seed, split]
    outs: [data/task/splits]

  build_kb:
    cmd: python -m trifact.data.build_kb
    deps: [src/trifact/data/build_kb.py, configs/labels.yaml, data/raw/wikidata]
    params: [linking]
    outs: [data/task/kb]

  build_ner:
    cmd: python -m trifact.data.build_ner
    deps: [src/trifact/data/build_ner.py, src/trifact/data/ner_common.py, src/trifact/data/wikimarkup.py,
           src/trifact/data/task_common.py,
           configs/labels.yaml, data/task/splits, data/task/kb/dataset.yaml, data/raw/wikipedia_wikitext,
           data/raw/wikidata/source.yaml]
    params: [scale, ner.silver, seed]
    outs: [data/task/ner]

  mt:        # import of the Kaggle NLLB runs (ADR-0020)
    foreach:
      xnli_kk: {run: data/external/kaggle/translate_xnli_kk, sources: xnli}
      qa: {run: data/external/kaggle/translate_qa, sources: "squad_v2,sberquad,kazqad,miracl"}
    do:
      cmd: python -m trifact.data.translations import ${key} --kaggle-out ${item.run}/out --sentences ${item.run}/sentences_all.parquet --sources ${item.sources} --retry data/external/kaggle/translate_retry/out
      deps: [src/trifact/data/translations.py, "${item.run}", data/external/kaggle/translate_retry]
      params: [curation.langid]
      outs: ["data/task/mt/${key}"]

  build_nli:
    cmd: python -m trifact.data.build_nli --scores data/external/kaggle/nli_score_xnli/out
    deps: [src/trifact/data/build_nli.py, data/raw/xnli, data/task/splits, data/task/mt/xnli_kk, data/external/kaggle/nli_score_xnli]
    params: [nli]
    outs: [data/task/nli]

  chunk_corpus:
    cmd: python -m trifact.data.chunk_corpus
    deps: [src/trifact/data/chunk_corpus.py, src/trifact/ingestion/chunker.py, src/trifact/ingestion/segment.py, data/curated/corpus]
    params: [scale, chunking, curation.stats.tokenizers.xlmr]
    outs: [{data/task/chunks: {persist: true}}]

  synthetic_queries: # import + filters of the Kaggle teacher runs (ADR-0015, ADR-0020)
    cmd: >-
      python -m trifact.data.synthetic import --kind queries
      --kaggle-out data/external/kaggle/teacher_queries/out data/stage3_teacher/teacher_queries2
    deps: [src/trifact/data/synthetic.py, data/task/chunks/dataset.yaml, data/external/kaggle/teacher_queries,
           data/stage3_teacher/teacher_queries2]
    params: [teacher, sft.mix, scale.min_kk_share]
    outs: [data/task/synthetic/queries]

  synthetic_qa:      # import writes the claim-level NLI pairs that the Kaggle nli_score run scored
    cmd: >-
      python -m trifact.data.synthetic import --kind qa
      --kaggle-out data/external/kaggle/teacher_qa/out data/stage3_teacher/teacher_qa2 &&
      python -m trifact.data.synthetic finalize --kind qa
      --scores data/stage3_teacher/nli_score_qa_v4 --scored-input data/stage3_teacher/nli_input_v4
    deps: [src/trifact/data/synthetic.py, data/task/chunks/dataset.yaml, data/external/kaggle/teacher_qa,
           data/stage3_teacher/teacher_qa2, data/stage3_teacher/nli_score_qa_v4, data/stage3_teacher/nli_input_v4]
    params: [teacher, sft.mix, scale.min_kk_share, verification.nli_job]
    outs: [data/task/synthetic/qa]

  build_pairs:
    cmd: python -m trifact.data.build_pairs --synthetic data/task/synthetic/queries
    deps: [src/trifact/data/build_pairs.py, src/trifact/data/qa_common.py, src/trifact/data/bm25.py,
           src/trifact/data/task_common.py, data/task/splits,
           data/task/mt/qa, data/task/synthetic/queries, data/raw/ms_marco, data/raw/mmarco_ru, data/raw/miracl,
           data/raw/miracl_corpus, data/raw/ru_hnp, data/raw/kazparc, data/raw/squad_v2, data/raw/sberquad, data/raw/kazqad,
           data/eval/retrieval, data/eval/qa]
    params: [scale, retrieval.hard_negatives_per_query, split, seed]
    outs: [data/task/retrieval]

  build_sft:
    cmd: python -m trifact.data.build_sft --synthetic data/task/synthetic/qa
    deps: [src/trifact/data/build_sft.py, src/trifact/data/qa_common.py, src/trifact/data/bm25.py,
           src/trifact/data/task_common.py, configs/prompts/grounded_answer.md, data/task/splits,
           data/task/mt/qa, data/task/synthetic/qa, data/eval/retrieval, data/eval/qa, data/raw/squad_v2,
           data/raw/sberquad, data/raw/kazqad]
    params: [scale, sft, nli.kk_filters]
    outs: [data/task/sft]

  build_eval:  # frozen sets are never rebuilt (frozen.json); MT-derived rows wait for the human review sheets
    cmd: python -m trifact.data.build_eval build
    deps: [src/trifact/data/build_eval.py, data/task/splits, data/task/ner, data/task/nli, data/task/mt/qa]
    params: [evaluation, seed]
    outs: [{data/eval/ner: {persist: true}}, {data/eval/qa: {persist: true}}, {data/eval/retrieval: {persist: true}},
           {data/eval/nli: {persist: true}}, {data/eval/review: {persist: true}}]
    metrics: [{reports/eval.json: {cache: false}}]

  eval_leakage:  # eval sets vs train data after every train rebuild (ADR-0007); train builders drop eval queries
    cmd: python -m trifact.data.build_eval leakage
    deps: [src/trifact/data/build_eval.py, src/trifact/data/task_common.py,
           data/eval/ner, data/eval/qa, data/eval/retrieval, data/eval/nli,
           data/task/ner, data/task/retrieval, data/task/sft, data/task/nli]
    metrics: [{reports/eval_leakage.json: {cache: false}}]

  task_eda:    # ROADMAP 3.7
    cmd: python -m trifact.data.task_eda
    deps: [src/trifact/data/task_eda.py, data/task/ner, data/task/sft, data/task/retrieval, data/task/nli,
           data/task/synthetic, data/eval/ner, data/eval/qa, data/eval/retrieval, data/eval/nli]
    outs: [reports/eda/task.json]

  # ------------------------------------------------ corpus index
  embed_corpus:
    cmd: python -m trifact.batch.embed_corpus --contextual-header --apply-downstream-filter
    deps: [src/trifact/batch/embed_corpus.py, src/trifact/retrieval/embedder.py, data/task/chunks]
    params: [retrieval.embedder, curation.downstream]
    outs: [{data/task/vectors: {persist: true}}]

  index_corpus:
    cmd: python -m trifact.batch.index_corpus
    deps: [src/trifact/batch/index_corpus.py, src/trifact/retrieval/store.py, data/task/vectors]
    params: [retrieval.corpus_index]
    metrics: [{reports/index.json: {cache: false}}]

  # ------------------------------------------------ stage 4: document processing
  build_docproc:  # ROADMAP 4.1; frozen after the first build (manifest.yaml), never rebuilt by repro
    cmd: python -m trifact.data.build_docproc
    deps: [src/trifact/data/build_docproc.py, data/clean/wikipedia]
    params: [docproc.bench]
    outs: [{data/eval/docproc: {persist: true}}]

  eval_docproc:   # ROADMAP 4.2-4.4: DOC-0 … DOC-3, office parsers, long documents, robustness, chunking variants
    cmd: python -m trifact.evaluation.eval_docproc
    deps: [src/trifact/evaluation/eval_docproc.py, src/trifact/ingestion, data/eval/docproc]
    params: [docproc, chunking, evaluation]
    outs: [{reports/docproc: {cache: false}}]
    metrics: [{reports/docproc.json: {cache: false}}]

  # ------------------------------------------------ stage 5: extraction
  train_ner:
    cmd: python -m trifact.training.train_ner --exp NER-1 --calibrate --out models/ner
    deps: [src/trifact/training/train_ner.py, src/trifact/extraction/ner.py, src/trifact/evaluation/eval_ner.py,
           src/trifact/evaluation/stats.py, configs/labels.yaml, data/task/ner]
    params: [ner, seed]
    outs: [{models/ner: {persist: true}}]

  eval_ner:
    cmd: python -m trifact.evaluation.eval_ner --model models/ner --eval-dir data/eval/ner --train-dir data/task/ner --out reports/ner.json --per-example reports/ner_per_example.jsonl --save-preds reports/ner_preds.jsonl
    deps: [src/trifact/evaluation/eval_ner.py, src/trifact/evaluation/stats.py, src/trifact/evaluation/gate.py,
           src/trifact/extraction/ner.py, models/ner, data/eval/ner, data/task/ner]
    params: [ner, evaluation, promotion, seed]
    metrics: [{reports/ner.json: {cache: false}}]

  annotate_corpus:
    cmd: python -m trifact.batch.annotate_corpus --input data/task/chunks --output data/task/annotations --model models/ner --backend hf --kb-db data/task/kb/kb_index.sqlite
    deps: [src/trifact/batch/annotate_corpus.py, src/trifact/extraction/ner.py, src/trifact/extraction/dates.py,
           src/trifact/extraction/linking.py, models/ner, data/task/chunks, data/task/kb]
    params: [ner, linking]
    outs: [{data/task/annotations: {persist: true}}]

  # ------------------------------------------------ stage 6: retrieval
  train_retriever:
    cmd: python -m trifact.training.train_retriever --out models/retriever
    deps: [src/trifact/training/train_retriever.py, src/trifact/retrieval/embedder.py, data/task/retrieval]
    params: [retrieval, seed]
    outs: [{models/retriever: {persist: true}}]

  train_reranker:
    cmd: python -m trifact.training.train_reranker --out models/reranker
    deps: [src/trifact/training/train_reranker.py, src/trifact/retrieval/reranker.py, data/task/retrieval]
    params: [retrieval, seed]
    outs: [{models/reranker: {persist: true}}]

  eval_retrieval:
    cmd: python -m trifact.evaluation.eval_retrieval --eval-dir data/eval/retrieval --out reports/retrieval.json
    deps: [src/trifact/evaluation/eval_retrieval.py, src/trifact/evaluation/stats.py, src/trifact/retrieval, data/eval/retrieval]
    params: [retrieval, evaluation, promotion, seed]
    metrics: [{reports/retrieval.json: {cache: false}}]

  # ------------------------------------------------ stage 7: generation (cloud GPU, ADR-0012)
  train_llm:
    cmd: python -m trifact.training.train_llm --sft-dir data/task/sft --out models/llm_adapter --report reports/train_llm.json
    deps: [src/trifact/training/train_llm.py, src/trifact/generation/prompt.py,
           configs/prompts/grounded_answer.md, data/task/sft]
    params: [llm, sft, cloud.budget_usd, seed]
    outs: [{models/llm_adapter: {persist: true}}]

  eval_generation:
    cmd: python -m trifact.evaluation.eval_generation --eval-dir data/eval/qa --out reports/generation.json --per-example reports/generation_per_example.jsonl
    deps: [src/trifact/evaluation/eval_generation.py, src/trifact/evaluation/stats.py,
           src/trifact/generation/prompt.py, src/trifact/generation/llm_client.py,
           src/trifact/verification/claims.py, src/trifact/verification/nli.py,
           configs/prompts/grounded_answer.md, data/eval/qa]
    params: [llm, sft.distractors, verification, evaluation, promotion, seed]
    metrics: [{reports/generation.json: {cache: false}}]

  # ------------------------------------------------ stage 8: verification
  train_nli:
    cmd: python -m trifact.training.train_nli
    deps: [src/trifact/training/train_nli.py, data/task/nli]
    params: [verification]
    outs: [models/nli]

  eval_verification:
    cmd: python -m trifact.evaluation.eval_verification
    deps: [src/trifact/evaluation/eval_verification.py, models/nli, data/eval]
    metrics: [{reports/verification.json: {cache: false}}]

  # ------------------------------------------------ stage 9: end-to-end + gate
  eval_e2e:
    cmd: python -m trifact.evaluation.eval_e2e
    deps: [src/trifact/evaluation/eval_e2e.py, reports/ner.json, reports/retrieval.json, reports/generation.json, reports/verification.json, data/eval]
    metrics: [{reports/e2e.json: {cache: false}}]

  gate:
    cmd: python -m trifact.evaluation.gate
    deps: [src/trifact/evaluation/gate.py, reports/e2e.json]
    params: [promotion, evaluation]
    metrics: [{reports/gate.json: {cache: false}}]
