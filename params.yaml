    revision: "20261101"
    role: corpus_links
    connections: 2
    workers: 4
    license: {license: CC-BY-SA-4.0 AND GFDL, use: allowed, release: true, evidence: "Wikimedia Terms of Use, dumps.wikimedia.org/legal.html; checked 2026-11-18"}
    files:                  # kk whole wiki; ru and en: the first page-id ranges (oldest, most linked articles),
      - {wiki: kkwiki, lang: kk, name: kkwiki-20261101-pages-articles.xml.bz2}   # enough for the 5-10M silver target
      - {wiki: ruwiki, lang: ru, name: ruwiki-20261101-pages-articles1.xml-p1p224167.bz2}
      - {wiki: ruwiki, lang: ru, name: ruwiki-20261101-pages-articles2.xml-p224168p1042043.bz2}
      - {wiki: ruwiki, lang: ru, name: ruwiki-20261101-pages-articles3.xml-p1042044p2198269.bz2}
      - {wiki: ruwiki, lang: ru, name: ruwiki-20261101-pages-articles4.xml-p2198270p3698269.bz2}  # stage 3: silver 4.42 M < 5 M
      - {wiki: enwiki, lang: en, name: enwiki-20261101-pages-articles1.xml-p1p41242.bz2}
      - {wiki: enwiki, lang: en, name: enwiki-20261101-pages-articles2.xml-p41243p151573.bz2}
      - {wiki: enwiki, lang: en, name: enwiki-20261101-pages-articles3.xml-p151574p311329.bz2}
      - {wiki: enwiki, lang: en, name: enwiki-20261101-pages-articles4.xml-p311330p558391.bz2}

curation:
  langid:                   # ROADMAP 2.2; model chosen by eval_langid (reports/langid.json)
    model: lid176           # best macro-F1 at min_score, 5.7x faster and 5.7x smaller than GlotLID (stage 2)
    candidates: [lid176, glotlid, glotlid_small]
    min_score: 0.65         # document lang_score below this -> dropped as lang_low_score
    min_para_chars: 20      # letters a line needs to be classified on its own
    max_para_chars: 1000    # prediction uses the first N characters of a paragraph
    cache: data/.cache/models
    models:
      lid176: {url: "https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.bin",
               sha256: 7e69ec5451bc261cc7844e49e4792a85d7f09c06789ec800fc4a44aec362764e, license: CC-BY-SA-3.0}
      glotlid: {hf_id: cis-lmu/glotlid, revision: e9592e0a9bc3b6f2a946de94faaa188d1dd6f522, file: model.bin,
                sha256: 3b26297652e105cb63acde0fbf5aa228161528b519331e58a7c94ea9fe58474c, license: Apache-2.0}
      glotlid_small: {hf_id: cis-lmu/glotlid, revision: e9592e0a9bc3b6f2a946de94faaa188d1dd6f522, file: model_v4_small.bin,
                      sha256: 7fdfc49052d42653a1b8db5fbb0754497d670a6a4fae32398692f8e5b3811bdd, license: Apache-2.0}
  sources: [wikipedia, fineweb2_kk, multidomain_kk]   # corpus sources; order = keep priority in cross-source dedup
  workers: 4                # processes per curation stage: pass-2 commit 2.1-2.6 GB each (stage 2 measurement), under lake.peak_ram_gb
  domains:                  # domain of each corpus shard; multidomain_kk by its input file
    wikipedia: wikipedia
    fineweb2_kk: web
    multidomain_kk: {cc100-monolingual-crawled-data.csv: cc100, kazakhBooks.csv: books, kazakhNews.csv: news,
                     leipzig.csv: leipzig, oscar.csv: oscar}
  boilerplate: {sample_docs: 20000, max_line_chars: 200, min_doc_share: 0.001, min_docs: 20}
  dropped_text_chars: 2000  # dropped documents keep this prefix for audit
  quality:                  # trifact.data.quality; tuned on the manual review sample (stage 2)
    default: {min_lang_conf: 0.0, min_chars: 100, min_words: 15, min_alpha_ratio: 0.6, max_replacement_ratio: 0.001,
              max_dup_line_ratio: 0.3, max_dup_ngram_ratio: 0.3, min_mean_word_len: 3.0, max_mean_word_len: 12.0,
              max_bullet_ratio: 0.9, max_ellipsis_ratio: 0.3, min_stopword_ratio: 0.02, stopword_min_words: 50}
    languages:              # stopword share p05 on the pilot: kk web/news 0.04, ru 0.06-0.13, en 0.13
      kk: {min_stopword_ratio: 0.01}
      ru: {min_stopword_ratio: 0.03}
      en: {min_stopword_ratio: 0.05}
    domains:
      wikipedia:            # curated text: foreign reference lines, tables, lists and stubs are normal
        min_lang_score: 0.5
        max_dup_line_ratio: 0.5
        min_stopword_ratio: 0.0
      # one record = one line: lang_score (agreement of paragraphs) is 1 by construction, so the model probability
      # lang_conf is the language signal. Stage 2 review (GlotLID, kk letters): ru/en records of multidomain_kk with
      # lang_conf < 0.65 were mostly Kazakh (ru cc100: 42k of 49k); kk keeps them (GlotLID agreed kk for 80 %)
      cc100: {min_chars: 40, min_words: 5, min_stopword_ratio: 0.0, languages: &one_line {ru: {min_lang_conf: 0.65}, en: {min_lang_conf: 0.65}}}
      leipzig: {min_chars: 40, min_words: 5, min_stopword_ratio: 0.0, languages: *one_line}
      news: {languages: *one_line}
      oscar: {languages: *one_line}
      books: {languages: *one_line}
  minhash:                  # ROADMAP 2.4; trifact.data.dedup
    num_perm: 126
    bands: 14               # 14 bands x 9 rows: S-curve midpoint J ~ 0.75, P(link | J=0.8) ~ 0.87, P(link | J=0.6) ~ 0.13
    ngram: 5                # word 5-gram shingles
    keep_near_within: [wikipedia]  # one article per entity: similar articles are templated stubs, not copies
  decontamination:          # ROADMAP 2.5: every split of the sources stage 3 builds eval sets from (ADR-0007)
    ngram: 13
    min_matches: 1            # one shared eval 13-gram makes the document contaminated
    max_removed_share: 0.5    # lines with eval grams are cut; above this share of chars the doc is dropped
    max_gram_docs: 100        # an eval 13-gram in more corpus documents is template text, ignored
    sources:
      kazqad: {columns: [context, question]}
      sberquad: {columns: [context, question]}
      squad_v2: {columns: [context, question]}
      xnli: {columns: [premise, hypothesis]}
      kaznerd: {tokens: tokens}
      wikiann: {tokens: tokens}
      wikineural: {tokens: tokens}
      nerel: {columns: [text]}
      miracl: {passages_from: miracl_corpus}   # queries + passages with relevance > 0
  stats:                    # ROADMAP 2.6; trifact.data.corpus_stats
    length_bins: [0, 100, 300, 1000, 3000, 10000, 30000, 100000]   # characters
    sample_docs: 3000         # per (source, lang) for tokenizer fertility, seeded hash of doc_id
    max_chars: 4000           # prefix of every sampled document
    tokenizers:               # tokenizer.json at pinned revisions (2026-11-18)
      xlmr: {hf_id: FacebookAI/xlm-roberta-base, revision: e73636d4f797dec63c3081bb6ed5c7b0bb3f2089,
             file: tokenizer.json, unk: "<unk>"}
      qwen3: {hf_id: Qwen/Qwen3-1.7B, revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e, file: tokenizer.json}
      qwen3_5: {hf_id: Qwen/Qwen3.5-2B, revision: 15852e8c16360a2fea060d615a32b45270f8a8fc, file: tokenizer.json}
    toxicity:                 # ROADMAP 2.6 sensitive content; trained on en/ru/tt/uk/... (not kk), openrail++
      hf_id: textdetox/bert-multilingual-toxicity-classifier
      revision: 8fe5526e9c6b69cf1a615104a2ad037fb266c670
      toxic_label: 1
      max_tokens: 256
      threshold: 0.5

  # EDA decisions (stage 2, PROGRESS 2026-11-20) applied where the index and training mixes are built (stages 6-7)
  downstream:
    kk_min_kk_letter_share: 0.05  # kk docs below it: stripped Kazakh letters or ru text, 1.06 % of curated kk;
                                  # left out of the index/mixes and sampled for the human review
    pii_mask: [iin, email]        # checksum-valid IIN (0.02 % of curated kk) and e-mails are masked; the phone
                                  # pattern also fires on dates and coordinates (45 % of en wikitext), not masked

split:
  by: source_document       # ADR-0007
  val: 0.1
  test: 0.1

chunking:
  max_tokens: 350
  overlap_tokens: 50
  # ROADMAP 4.3: variants prepared for stage 6, chosen there by retrieval metrics (architecture §6.1).
  # sections: false lets a chunk cross section boundaries (the corpus has no sections either way).
  variants:
    s350:  {max_tokens: 350, overlap_tokens: 50, sections: true}    # default (above)
    s200:  {max_tokens: 200, overlap_tokens: 30, sections: true}
    s512:  {max_tokens: 512, overlap_tokens: 64, sections: true}
    flat350: {max_tokens: 350, overlap_tokens: 50, sections: false}

docproc:                    # stage 4, architecture §7.1, ADR-0021
  engine: router            # DOC-3 champion; pymupdf | docling | router
  limits:                   # architecture §6.1 "Устойчивость": failed with a reason, the worker survives
    max_bytes: 209715200    # 200 MB upload
    max_pages: 2000
    timeout_s: 600          # per document, enforced by the isolated parse process
    max_rss_gb: 6.0         # parse process killed above this
    max_chars: 50000000     # text of one document
  pymupdf:
    min_page_chars: 40      # fewer text-layer characters -> the page needs OCR
    max_bad_char_share: 0.10  # U+FFFD / private-use share of a text layer -> broken encoding, OCR
    heading_size_ratio: 1.15  # span size / body size that makes a short block a heading
    heading_max_chars: 200
    furniture_band: 0.08    # top/bottom page share where running headers and footers are looked for
    furniture_min_share: 0.5  # a line repeated on this share of pages (>= 3 pages) is a header/footer
  ocr:
    engine: tesseract       # DOC-2 champion: only Tesseract keeps the Kazakh letters (reports/docproc.json)
    langs: [kaz, rus, eng]
    dpi: 300
    tessdata: data/.cache/models/tessdata   # TESSDATA_PREFIX of both PyMuPDF OCR and Docling Tesseract CLI
    tesseract_cmd: "C:/Program Files/Tesseract-OCR/tesseract.exe"   # overridden by TRIFACT_TESSERACT on Linux
    models:                 # tessdata_best 4.1.0 (github.com/tesseract-ocr/tessdata_best), Apache-2.0; 2026-11-20
      kaz: {url: "https://github.com/tesseract-ocr/tessdata_best/raw/4.1.0/kaz.traineddata", sha256: 34cbd9204b1ff3cc813d50b29e3c0ae3752bcc201f261a4a393ceca3895aea9d}
      rus: {url: "https://github.com/tesseract-ocr/tessdata_best/raw/4.1.0/rus.traineddata", sha256: b617eb6830ffabaaa795dd87ea7fd251adfe9cf0efe05eb9a2e8128b7728d6b6}
      eng: {url: "https://github.com/tesseract-ocr/tessdata_best/raw/4.1.0/eng.traineddata", sha256: 8280aed0782fe27257a68ea10fe7ef324ca0f8d85bd2fd145d1c2b560bcb66ba}
      osd: {url: "https://github.com/tesseract-ocr/tessdata_best/raw/4.1.0/osd.traineddata", sha256: 9cf5d576fcc47564f11265841e5ca839001e7e6f38ff7f7aacf46d15a96b00ff}
  docling:
    threads: 8
    table_mode: fast        # TableFormer: fast = cell F1 0.993 vs 1.000 for accurate, 1.4x faster table pages
    ocr_engine: tesseract   # tesseract | easyocr | rapidocr (DOC-2)
  router:                   # DOC-3: a page goes to Docling when it has any of these signals (reports/docproc.json)
    columns: false          # >= 2 text columns (XY-cut): the fast path reads them as well as Docling, 100x faster
    tables: true            # ruled grid or >= table_min_rows rows of aligned short cells
    table_min_rows: 3
    scans: docling          # docling = Docling + Tesseract CLI (CER, headings, tables better) | ocr = PyMuPDF + Tesseract
  bench:                    # trifact.data.build_docproc + trifact.evaluation.eval_docproc
    seed: 42
    docs_per_kind: 6        # per language and document kind
    min_pages: 2
    max_pages: 4
    big_doc_pages: 300      # one text PDF of this size per language for throughput/RAM (NFR: >= 2 pages/s)
    block_match_min: 80     # rapidfuzz partial ratio that locates a reference block in the output
    heading_match_min: 90
    source: clean/wikipedia # real kk/ru/en paragraphs and section titles (CC-BY-SA-3.0, allowed)
    fonts:                  # first existing file wins (Windows, then Debian DejaVu)
      sans: ["C:/Windows/Fonts/arial.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"]
      sans_bold: ["C:/Windows/Fonts/arialbd.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"]
      serif: ["C:/Windows/Fonts/times.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf"]
      serif_bold: ["C:/Windows/Fonts/timesbd.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf"]

ner:
  base_model: FacebookAI/xlm-roberta-base
  backend: hf               # eligible champion backend (NER-5 ONNX int8 rejected on EN parity > 0.5 pp)
  labels: configs/labels.yaml
  calibration_min_precision: 0.85
  silver:                   # ADR-0015, trifact.data.build_ner
    min_tokens: 5
    max_tokens: 80
    capital_filter: true    # drop sentences with a capitalized non-initial word linked nowhere (likely missed entity)
    gazetteer_min_count: 3  # noise estimate: silver surfaces seen >= 3 times ...
    gazetteer_min_share: 0.9  # ... with >= 90% one type
  curriculum: [silver, gold]
  epochs: 5
  lr: 4.45e-5               # Optuna HPO winner (stage 5, 2026-11-25)
  batch_size: 32
  max_length: 256
  seeds: [42, 43, 44]

linking:
  kb_min_labels: 1          # entity kept if it has a label in at least one of kk/ru/en
  kb_index: data/task/kb/kb_index.sqlite
  candidates_k: 20
  nil_threshold: 0.35

retrieval:
  embedder: BAAI/bge-m3
  embedder_challengers: [intfloat/multilingual-e5-large-instruct, Qwen/Qwen3-Embedding-0.6B]
  reranker: BAAI/bge-reranker-v2-m3
  reranker_challengers: [Qwen/Qwen3-Reranker-0.6B]
  prefetch_k: 100
  candidates_k: 50
  rrf_k: 60
  context_k: 8
  hard_negatives_per_query: 4
  corpus_index:             # ADR-0013 (RET-S measured 1M: scalar int8 0.82 R@10 vs 0.34 binary)
    vectors_on_disk: true
    datatype: float16
    quantization: scalar    # none | scalar | binary | turbo — RET-S winner (scalar int8 + rescore)
    rescore: true
    oversampling: 2.0
    contextual_header: true # RET-C winner (+3.64 pp nDCG@10 at zero extra chunks)
    hnsw: {m: 16, ef_construct: 128, on_disk: false}
    mrl_dim: null           # Qwen3-Embedding only: 256 | 512 | 1024

nli:                        # stage 3.4, trifact.data.build_nli
  kk_filters: {min_chrf_back: 30, min_lang_score: 0.5, min_len_ratio: 0.5, max_len_ratio: 2.0}

mt:                         # NLLB-200 on Kaggle T4 x2 (ADR-0020); revisions resolved 2026-11-18
  model: {hf_id: facebook/nllb-200-distilled-1.3B, revision: 7be3e24664b38ce1cac29b8aeed6911aa0cf0576, license: CC-BY-NC-4.0}
  back_model: {hf_id: facebook/nllb-200-distilled-600M, revision: f8d333a098d19b4fd9a8b18f94170487ad3f821d, license: CC-BY-NC-4.0}
  beams: 2

sft:
  mix: {answerable: 0.60, cross_lingual: 0.25, unanswerable: 0.15}
  distractors: 3            # BM25 contexts added to the gold context as evidence

teacher:                    # ADR-0015, ADR-0020: llama.cpp on Kaggle T4 x2 (vLLM MoE kernels need sm80)
  model: Qwen/Qwen3.5-35B-A3B
  filters: {round_trip_top_k: 10, min_nli_entail: 0.7}
  serve: {repo: unsloth/Qwen3.5-35B-A3B-GGUF, revision: bc014a17be43adabd7066b7a86075ff935c6a4e2,
          file: Qwen3.5-35B-A3B-UD-IQ4_XS.gguf, llama_cpp_ref: b12032, parallel: 16, ctx_per_slot: 4096,
          temperature: 0.7, top_p: 0.9, batch: 4096, ubatch: 2048, extra_args: [-kvu]}
          # measured 2026-11-18 (llama-batched-bench, 2x T4, 400+64 tokens): 16 sequences 740 tok/s with a unified
          # KV cache (-kvu) vs 305 tok/s without (hybrid DeltaNet layers); single sequence pp 935 / tg 57 tok/s.
          # 2026-11-21, 16 sequences x 1500 prompt tokens: prefill 1134 tok/s at -ub 512, 1254 at 1024, 1496 at 2048;
          # decode ~190 tok/s; 32 sequences x 550: decode 220 vs 201 tok/s at 16 (parallel stays 16)
  time_budget_h: 11.0       # per Kaggle session (12 h limit); weekly GPU quota 30 h, cost 0 USD

llm:                        # ADR-0012
  base_model: Qwen/Qwen3.5-2B
  candidates: [Qwen/Qwen3.5-0.8B, Qwen/Qwen3.5-4B, Qwen/Qwen3.5-9B]
  control_baseline: Qwen/Qwen3-1.7B
  lora: {dtype: bf16, r: 16, alpha: 32, dropout: 0.05,
         target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
  thinking: false
  epochs: 2
  lr: 2.0e-4
  max_seq_len: 4096
  serve_quant: Q4_K_M

verification:
  nli_model: MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7
  nli_job: {model: MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7, revision: b5113eb38ab63efdd7f280f8c144ea8b13f978ce,
            batch_size: 128, max_length: 512}   # Kaggle nli_score: label consistency (stage 3)
  nli_challengers: [MoritzLaurer/bge-m3-zeroshot-v2.0]
  nei_ratio_threshold: 0.3
  faithfulness_audit_claims: 200   # per language: human check of the verifier verdicts behind faithfulness (ADR-0022)

evaluation:
  bootstrap_samples: 1000
  ci: 0.95
  human_verified_min: 3500
  review_per_kind: 500      # MT-derived eval rows per direction / kind on the human review sheet
  real_docs_min: 50
  autonomous_validation:    # ADR-0026: autonomous dual-signal machine cross-validation + report-level human governance
    protocol: ADR-0026
    quality_items: 1500
    ner_items: 600
    eval_items: 3500
    require_report_approval: true   # governance sign-off at report level; human_verified stays 0 for machine-validated rows

promotion:                  # ADR-0009, architecture §10
  ner_kk_f1_min_gain: 0.03
  ner_other_max_drop: 0.01
  retrieval_no_direction_worse: true
  faithfulness_min: 0.85
  worst_direction_max_gap: 0.10
  # starting values (architecture §1 style): revised on the stage 8 human claim labels before the first gate run
  verification_contradicted_precision_min: 0.90
  verification_ece_max: 0.05
  e2e_p95_latency_s: 6.0
  e2e_injection_no_worse: true   # prompt-injection attack success rate not above the champion (ADR-0023)

cloud:                      # ADR-0025
  budget_usd: 0             # change only before an approved paid run
