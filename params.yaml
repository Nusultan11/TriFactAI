# Single source of truth for data, training and evaluation parameters (DVC + MLflow).
# Architecture: docs/architecture/docs/01-architecture.md. Experiments are overrides of these keys, never script copies.
seed: 42
languages: [kk, ru, en]

scale:
  profile: full             # pilot | full — same code, different volumes (architecture §1)
  pilot:   {corpus_docs: 30000, corpus_chunks: 150000,   ner_sentences: 80000,   sft_examples: 24000,   retrieval_pairs: 10000,    eval_examples: 3000}
  full:    {corpus_docs: null,  corpus_chunks: 35000000, ner_sentences: 10000000, sft_examples: 2000000, retrieval_pairs: 20000000, eval_examples: 50000}
  min_kk_share: 0.30        # in SFT and eval
  index_steps: [1000000, 10000000, 35000000]   # RET-S scale ladder

lake:                       # ADR-0011
  root: data
  layers: [raw, clean, curated, task, eval]
  shard_rows: 1000000
  shard_max_mb: 512
  compression: zstd
  peak_ram_gb: 10
  downloads: data/.cache/downloads   # resumable download staging, outside DVC outs
  acquire_workers: 4                 # files downloaded and converted in parallel

# Sources of the raw layer (ADR-0011, ADR-0017). `revision`: commit SHA (HF) or dump date (URL) of the first
# download. `files` maps repository paths (glob) to lang/table; the split comes from the path unless given.
# `license.use` decides whether a source may be acquired at all (blocked = never); `release` propagates to
# derived sets (ADR-0015). Evidence for every decision: docs/research/datasets.md §7.
sources:
  wikipedia:
    hf_id: wikimedia/wikipedia
    revision: b04c8d1ceb2f5cd4588862100d08de323dccfbaa
    role: corpus
    license: {license: CC-BY-SA-3.0 AND GFDL, use: allowed, release: true, evidence: "HF card, Wikimedia terms; checked 2026-11-18"}
    files:
      - {glob: "20231101.kk/*.parquet", lang: kk, config: 20231101.kk}
      - {glob: "20231101.ru/*.parquet", lang: ru, config: 20231101.ru}
      - {glob: "20231101.en/*.parquet", lang: en, config: 20231101.en}
  fineweb2_kk:
    hf_id: HuggingFaceFW/fineweb-2
    revision: af9c13333eb981300149d5ca60a8e9d659b276b9
    role: corpus
    license: {license: ODC-By-1.0, use: allowed, release: true, evidence: "HF card (ODC-By + CommonCrawl ToU); checked 2026-11-18"}
    files:
      - {glob: "data/kaz_Cyrl/*/*.parquet", lang: kk, config: kaz_Cyrl}
  multidomain_kk:
    hf_id: kz-transformers/multidomain-kazakh-dataset
    revision: 7a1fcdf9830b1c34b44b3038aafb672447f41890
    role: corpus
    license: {license: Apache-2.0, use: allowed, release: false, evidence: "HF card apache-2.0; checked 2026-11-18",
              note: "aggregates CC100, OSCAR, news and books; the card licence does not clear third-party text, derived text is not released"}
    files:
      - {glob: "*.csv", lang: kk, split: train}
  kazparc:
    hf_id: issai/kazparc
    revision: 41df65bd299ae0b5f2222d86f3db2f4fdd44e8e6
    role: parallel
    gated: true
    license: {license: CC-BY-4.0, use: allowed, release: true, evidence: "authors: arXiv:2403.19399 abstract and ISSAI release page; checked 2026-11-18",
              note: "HF card has no licence field; licence taken from the authors' publication"}
    files:
      - {glob: "kazparc/01_*.csv", lang: multi, table: entries, config: kazparc_raw, split: train}
      - {glob: "kazparc/[01][0-9]_kazparc_*_*_*.csv", lang: multi, table: pairs, config: kazparc}
      - {glob: "sync/20_*.csv", lang: multi, table: sync_entries, config: sync_raw, split: train}
      - {glob: "sync/[23][0-9]_sync_*_*_*.csv", lang: multi, table: sync_pairs, config: sync}
  kaznerd:
    hf_id: issai/kaznerd
    revision: 48703dd057d083c30394acc89334876a009d200d
    role: ner
    gated: true
