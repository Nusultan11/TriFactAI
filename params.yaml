# Single source of truth for data, training and evaluation parameters (DVC + MLflow).
# Architecture: docs/architecture/docs/01-architecture.md. Experiments are overrides of these keys, never script copies.
seed: 42
languages: [kk, ru, en]

scale:
  profile: pilot            # pilot | full — same code, different volumes (architecture §1)
  pilot:   {corpus_docs: 30000, corpus_chunks: 150000,   ner_sentences: 80000,   sft_examples: 24000,   retrieval_pairs: 10000,    eval_examples: 3000}
  full:    {corpus_docs: null,  corpus_chunks: 35000000, ner_sentences: 10000000, sft_examples: 2000000, retrieval_pairs: 20000000, eval_examples: 50000}
  min_kk_share: 0.30        # in SFT and eval
  index_steps: [1000000, 10000000, 35000000]   # RET-S scale ladder

lake:                       # ADR-0011
  root: data
  layers: [raw, clean, curated, task, eval]
  shard_rows: 1000000
  shard_max_mb: 512
  compression: zstd
  peak_ram_gb: 10
  downloads: data/.cache/downloads   # resumable download staging, outside DVC outs
  acquire_workers: 4                 # files downloaded and converted in parallel

# Sources of the raw layer (ADR-0011, ADR-0017). `revision`: commit SHA (HF) or dump date (URL) of the first
# download. `files` maps repository paths (glob) to lang/table; the split comes from the path unless given.
# `license.use` decides whether a source may be acquired at all (blocked = never); `release` propagates to
# derived sets (ADR-0015). Evidence for every decision: docs/research/datasets.md §7.
sources:
  wikipedia:
    hf_id: wikimedia/wikipedia
    revision: b04c8d1ceb2f5cd4588862100d08de323dccfbaa
    role: corpus
    license: {license: CC-BY-SA-3.0 AND GFDL, use: allowed, release: true, evidence: "HF card, Wikimedia terms; checked 2026-11-18"}
    files:
      - {glob: "20231101.kk/*.parquet", lang: kk, config: 20231101.kk}
      - {glob: "20231101.ru/*.parquet", lang: ru, config: 20231101.ru}
      - {glob: "20231101.en/*.parquet", lang: en, config: 20231101.en}
  fineweb2_kk:
    hf_id: HuggingFaceFW/fineweb-2
    revision: af9c13333eb981300149d5ca60a8e9d659b276b9
    role: corpus
    license: {license: ODC-By-1.0, use: allowed, release: true, evidence: "HF card (ODC-By + CommonCrawl ToU); checked 2026-11-18"}
    files:
      - {glob: "data/kaz_Cyrl/*/*.parquet", lang: kk, config: kaz_Cyrl}
  multidomain_kk:
    hf_id: kz-transformers/multidomain-kazakh-dataset
    revision: 7a1fcdf9830b1c34b44b3038aafb672447f41890
    role: corpus
    license: {license: Apache-2.0, use: allowed, release: false, evidence: "HF card apache-2.0; checked 2026-11-18",
              note: "aggregates CC100, OSCAR, news and books; the card licence does not clear third-party text, derived text is not released"}
    files:
      - {glob: "*.csv", lang: kk, split: train}
  kazparc:
    hf_id: issai/kazparc
    revision: 41df65bd299ae0b5f2222d86f3db2f4fdd44e8e6
    role: parallel
    gated: true
    license: {license: CC-BY-4.0, use: allowed, release: true, evidence: "authors: arXiv:2403.19399 abstract and ISSAI release page; checked 2026-11-18",
              note: "HF card has no licence field; licence taken from the authors' publication"}
    files:
      - {glob: "kazparc/01_*.csv", lang: multi, table: entries, config: kazparc_raw, split: train}
      - {glob: "kazparc/[01][0-9]_kazparc_*_*_*.csv", lang: multi, table: pairs, config: kazparc}
      - {glob: "sync/20_*.csv", lang: multi, table: sync_entries, config: sync_raw, split: train}
      - {glob: "sync/[23][0-9]_sync_*_*_*.csv", lang: multi, table: sync_pairs, config: sync}
  kaznerd:
    hf_id: issai/kaznerd
    revision: 48703dd057d083c30394acc89334876a009d200d
    role: ner
    gated: true
    license: {license: CC-BY-4.0, use: allowed, release: true, evidence: "HF card; checked 2026-11-18"}
    files:
      - {glob: "*.arrow", lang: kk, config: KazNERD}
  wikiann:
    hf_id: unimelb-nlp/wikiann
    revision: f0a3be6dc5564c0cc4150bb660144800a1f539d4
    role: ner
    license: {license: unknown (text CC-BY-SA-3.0), use: research_only, release: false,
              evidence: "HF card 'unknown'; github.com/afshinrahimi/mmner is Apache-2.0 code, data on Dropbox without licence; checked 2026-11-18",
              note: "no explicit data licence from the publisher: train/eval only until confirmed"}
    files:
      - {glob: "kk/*.parquet", lang: kk, config: kk}
      - {glob: "ru/*.parquet", lang: ru, config: ru}
      - {glob: "en/*.parquet", lang: en, config: en}
  wikineural:
    hf_id: Babelscape/wikineural
    revision: 74c9b9dca034bb1606a6769457983904bd976803
    role: ner
    license: {license: CC-BY-NC-SA-4.0, use: research_only, release: false, evidence: "HF card; checked 2026-11-18"}
    files:
      - {glob: "data/*_ru-*.parquet", lang: ru, config: default, meta_split: "{split}_ru"}
      - {glob: "data/*_en-*.parquet", lang: en, config: default, meta_split: "{split}_en"}
  nerel:
    hf_id: iluvvatar/NEREL
    revision: b8bbfeb80905e6d66dc06a47ec6e37b502ea6c69
    role: ner
    license: {license: unknown, use: research_only, release: false,
              evidence: "no licence in HF card or github.com/nerel-ds/NEREL; the RANLP 2021 paper is CC-BY-4.0; checked 2026-11-18",
              note: "authors call the data freely available: train/eval only until a data licence is confirmed"}
    files:
      - {glob: "data/*.jsonl", lang: ru}
      - {glob: "ent_types.jsonl", lang: ru, table: ent_types}
      - {glob: "rel_types.jsonl", lang: ru, table: rel_types}
  squad_v2:
    hf_id: rajpurkar/squad_v2
    revision: 3ffb306f725f7d2ce8394bc1873b24868140c412
    role: qa
    license: {license: CC-BY-SA-4.0, use: allowed, release: true, evidence: "HF card; checked 2026-11-18"}
    files:
      - {glob: "squad_v2/*.parquet", lang: en, config: squad_v2}
  sberquad:
    hf_id: kuznetsoffandrey/sberquad
    revision: deb870ee29b280657470f2c3851e9b23899fdbc3
    role: qa
    license: {license: unknown, use: research_only, release: false,
              evidence: "HF card 'unknown', TFDS 'No known license', arXiv:1912.09723; checked 2026-11-18"}
    files:
      - {glob: "sberquad/*.parquet", lang: ru, config: sberquad}
  kazqad:
    hf_id: issai/kazqad
    revision: 2e43ff9596a8e075c3cd0ba3ab7584a74afca6bc
    role: qa
    gated: true
    license: {license: CC-BY-SA-4.0, use: allowed, release: true, evidence: "HF card; checked 2026-11-18"}
    files:
      - {glob: "kazqad/*.jsonl.gz", lang: kk, config: kazqad}
      - {glob: "nq-translate-kk/*.jsonl.gz", lang: kk, config: nq-translate-kk, split: train}
      - {glob: "nq-original-en/*.jsonl.gz", lang: en, config: nq-original-en, split: train}
  ms_marco:
    hf_id: microsoft/ms_marco
    revision: a47ee7aae8d7d466ba15f9f0bfac3b3681087b3a
    role: retrieval
    license: {license: MS MARCO terms (non-commercial research), use: research_only, release: false,
              evidence: "microsoft.github.io/msmarco/Notice; checked 2026-11-18"}
    files:
      - {glob: "v1.1/*.parquet", lang: en, config: v1.1}
      - {glob: "v2.1/*.parquet", lang: en, config: v2.1}
  mmarco_ru:
    hf_id: unicamp-dl/mmarco
    revision: 6d039c4638c0ba3e46a9cb7b498b145e7edc6230
    role: retrieval
    license: {license: MS MARCO terms (non-commercial research), use: research_only, release: false,
              evidence: "translation of MS MARCO; repo code Apache-2.0, data inherits MS MARCO terms; checked 2026-11-18"}
    files:
      - {glob: "data/google/collections/russian_collection.tsv", lang: ru, table: collection, columns: [pid, text]}
      - {glob: "data/google/queries/*/russian_queries.*.tsv", lang: ru, table: queries, columns: [qid, text]}
      - {glob: "data/triples.train.ids.small.tsv", lang: multi, table: triples, split: train, columns: [qid, pos_pid, neg_pid]}
  miracl:
    hf_id: miracl/miracl
    revision: 5be20db9509754dadad47689368639fcec739c00
    role: retrieval
    license: {license: Apache-2.0, use: allowed, release: true, evidence: "HF card; checked 2026-11-18"}
    files:
      - {glob: "miracl-v1.0-ru/topics/*.tsv", lang: ru, table: topics, columns: [qid, query]}
      - {glob: "miracl-v1.0-en/topics/*.tsv", lang: en, table: topics, columns: [qid, query]}
      - {glob: "miracl-v1.0-ru/qrels/*.tsv", lang: ru, table: qrels, columns: [qid, q0, docid, relevance]}
      - {glob: "miracl-v1.0-en/qrels/*.tsv", lang: en, table: qrels, columns: [qid, q0, docid, relevance]}
  miracl_corpus:
    hf_id: miracl/miracl-corpus
    revision: d921ec7e349ce0d28daf30b2da9da5ee698bef0d
    role: retrieval
    license: {license: Apache-2.0 (text CC-BY-SA-3.0 Wikipedia), use: allowed, release: true, evidence: "HF card; checked 2026-11-18"}
    files:
      - {glob: "miracl-corpus-v1.0-ru/*.jsonl.gz", lang: ru, split: train}
      - {glob: "miracl-corpus-v1.0-en/*.jsonl.gz", lang: en, split: train}
  ru_hnp:
    hf_id: deepvk/ru-HNP
    revision: f43fca040b2635de6163b2b4ed16e5e5907f20f8
    role: retrieval
    license: {license: Apache-2.0, use: allowed, release: true, evidence: "HF card; checked 2026-11-18",
              note: "pairs generated by gpt-3.5-turbo from Wikipedia"}
    files:
      - {glob: "*.parquet", lang: ru, config: default}
  xnli:
    hf_id: facebook/xnli
    revision: b8dd5d7af51114dbda02c0e3f6133f332186418e
    role: nli
    license: {license: CC-BY-NC-4.0, use: research_only, release: false, evidence: "HF card, XNLI paper; checked 2026-11-18"}
    files:
      - {glob: "ru/*.parquet", lang: ru, config: ru}
      - {glob: "en/*.parquet", lang: en, config: en}
  wikidata:
    url: https://dumps.wikimedia.org/wikidatawiki/entities/20261116/wikidata-20261116-all.json.bz2
    checksum_url: https://dumps.wikimedia.org/wikidatawiki/entities/20261116/wikidata-20261116-sha1sums.txt
    revision: "20261116"
    role: kb
    connections: 3          # dumps.wikimedia.org: ~0.3-1.2 MB/s per connection, HTTP 429 from the 4th one
    mirrors: [https://dumps.wikimedia.your.org/wikidatawiki/entities/20261116/wikidata-20261116-all.json.bz2]
    mirror_connections: 3   # extra connections per mirror; the published sha1 is checked over the whole file
    workers: 12             # parse processes
    license: {license: CC0-1.0, use: allowed, release: true, evidence: "wikidata.org/wiki/Wikidata:Licensing; checked 2026-11-18"}

curation:
  langid:                   # ROADMAP 2.2; model chosen by eval_langid (reports/langid.json)
    model: lid176           # best macro-F1 at min_score, 5.7x faster and 5.7x smaller than GlotLID (stage 2)
    candidates: [lid176, glotlid, glotlid_small]
    min_score: 0.65         # document lang_score below this -> dropped as lang_low_score
    min_para_chars: 20      # letters a line needs to be classified on its own
    max_para_chars: 1000    # prediction uses the first N characters of a paragraph
    cache: data/.cache/models
    models:
      lid176: {url: "https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.bin",
               sha256: 7e69ec5451bc261cc7844e49e4792a85d7f09c06789ec800fc4a44aec362764e, license: CC-BY-SA-3.0}
      glotlid: {hf_id: cis-lmu/glotlid, revision: e9592e0a9bc3b6f2a946de94faaa188d1dd6f522, file: model.bin,
                sha256: 3b26297652e105cb63acde0fbf5aa228161528b519331e58a7c94ea9fe58474c, license: Apache-2.0}
      glotlid_small: {hf_id: cis-lmu/glotlid, revision: e9592e0a9bc3b6f2a946de94faaa188d1dd6f522, file: model_v4_small.bin,
                      sha256: 7fdfc49052d42653a1b8db5fbb0754497d670a6a4fae32398692f8e5b3811bdd, license: Apache-2.0}
  sources: [wikipedia, fineweb2_kk, multidomain_kk]   # corpus sources; order = keep priority in cross-source dedup
  workers: 4                # processes per curation stage: pass-2 commit 2.1-2.6 GB each (stage 2 measurement), under lake.peak_ram_gb
  domains:                  # domain of each corpus shard; multidomain_kk by its input file
    wikipedia: wikipedia
    fineweb2_kk: web
    multidomain_kk: {cc100-monolingual-crawled-data.csv: cc100, kazakhBooks.csv: books, kazakhNews.csv: news,
                     leipzig.csv: leipzig, oscar.csv: oscar}
  boilerplate: {sample_docs: 20000, max_line_chars: 200, min_doc_share: 0.001, min_docs: 20}
  dropped_text_chars: 2000  # dropped documents keep this prefix for audit
  quality:                  # trifact.data.quality; tuned on the manual review sample (stage 2)
    default: {min_lang_conf: 0.0, min_chars: 100, min_words: 15, min_alpha_ratio: 0.6, max_replacement_ratio: 0.001,
              max_dup_line_ratio: 0.3, max_dup_ngram_ratio: 0.3, min_mean_word_len: 3.0, max_mean_word_len: 12.0,
              max_bullet_ratio: 0.9, max_ellipsis_ratio: 0.3, min_stopword_ratio: 0.02, stopword_min_words: 50}
    languages:              # stopword share p05 on the pilot: kk web/news 0.04, ru 0.06-0.13, en 0.13
      kk: {min_stopword_ratio: 0.01}
      ru: {min_stopword_ratio: 0.03}
      en: {min_stopword_ratio: 0.05}
    domains:
      wikipedia:            # curated text: foreign reference lines, tables, lists and stubs are normal
        min_lang_score: 0.5
        max_dup_line_ratio: 0.5
        min_stopword_ratio: 0.0
      cc100: {min_chars: 40, min_words: 5, min_stopword_ratio: 0.0}  # one sentence per record
      leipzig: {min_chars: 40, min_words: 5, min_stopword_ratio: 0.0}
  minhash:                  # ROADMAP 2.4; trifact.data.dedup
    num_perm: 126
    bands: 14               # 14 bands x 9 rows: S-curve midpoint J ~ 0.75, P(link | J=0.8) ~ 0.87, P(link | J=0.6) ~ 0.13
    ngram: 5                # word 5-gram shingles
    keep_near_within: [wikipedia]  # one article per entity: similar articles are templated stubs, not copies
  decontamination:          # ROADMAP 2.5: every split of the sources stage 3 builds eval sets from (ADR-0007)
    ngram: 13
    min_matches: 1            # one shared eval 13-gram makes the document contaminated
    max_removed_share: 0.5    # lines with eval grams are cut; above this share of chars the doc is dropped
    max_gram_docs: 100        # an eval 13-gram in more corpus documents is template text, ignored
    sources:
      kazqad: {columns: [context, question]}
      sberquad: {columns: [context, question]}
      squad_v2: {columns: [context, question]}
      xnli: {columns: [premise, hypothesis]}
      kaznerd: {tokens: tokens}
      wikiann: {tokens: tokens}
      wikineural: {tokens: tokens}
      nerel: {columns: [text]}
      miracl: {passages_from: miracl_corpus}   # queries + passages with relevance > 0
  stats:                    # ROADMAP 2.6; trifact.data.corpus_stats
    length_bins: [0, 100, 300, 1000, 3000, 10000, 30000, 100000]   # characters
    sample_docs: 3000         # per (source, lang) for tokenizer fertility, seeded hash of doc_id
    max_chars: 4000           # prefix of every sampled document
    tokenizers:               # tokenizer.json at pinned revisions (2026-11-18)
      xlmr: {hf_id: FacebookAI/xlm-roberta-base, revision: e73636d4f797dec63c3081bb6ed5c7b0bb3f2089,
             file: tokenizer.json, unk: "<unk>"}
      qwen3: {hf_id: Qwen/Qwen3-1.7B, revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e, file: tokenizer.json}
      qwen3_5: {hf_id: Qwen/Qwen3.5-2B, revision: 15852e8c16360a2fea060d615a32b45270f8a8fc, file: tokenizer.json}

split:
  by: source_document       # ADR-0007
  val: 0.1
  test: 0.1

chunking:
  max_tokens: 350
  overlap_tokens: 50

ner:
  base_model: FacebookAI/xlm-roberta-base
  labels: configs/labels.yaml
  curriculum: [silver, gold]
  epochs: 5
  lr: 3.0e-5
  batch_size: 32
  max_length: 256
  seeds: [42, 43, 44]

linking:
  kb_min_labels: 1          # entity kept if it has a label in at least one of kk/ru/en
  candidates_k: 20

retrieval:
  embedder: BAAI/bge-m3
  embedder_challengers: [intfloat/multilingual-e5-large-instruct, Qwen/Qwen3-Embedding-0.6B]
  reranker: BAAI/bge-reranker-v2-m3
  reranker_challengers: [Qwen/Qwen3-Reranker-0.6B]
  prefetch_k: 100
  candidates_k: 50
  rrf_k: 60
  context_k: 8
  hard_negatives_per_query: 4
  corpus_index:             # ADR-0013
    vectors_on_disk: true
    datatype: float16
    quantization: binary    # none | scalar | binary | turbo — RET-S
    rescore: true
    oversampling: 3.0
    hnsw: {m: 16, ef_construct: 128, on_disk: false}
    mrl_dim: null           # Qwen3-Embedding only: 256 | 512 | 1024

sft:
  mix: {answerable: 0.60, cross_lingual: 0.25, unanswerable: 0.15}

teacher:                    # ADR-0015, cloud vLLM
  model: Qwen/Qwen3.5-35B-A3B
  filters: {round_trip_top_k: 10, min_nli_entail: 0.7}

llm:                        # ADR-0012
  base_model: Qwen/Qwen3.5-2B
  candidates: [Qwen/Qwen3.5-0.8B, Qwen/Qwen3.5-4B, Qwen/Qwen3.5-9B]
  control_baseline: Qwen/Qwen3-1.7B
  lora: {dtype: bf16, r: 16, alpha: 32, dropout: 0.05,
         target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
  thinking: false
  epochs: 2
  lr: 2.0e-4
  max_seq_len: 4096
  serve_quant: Q4_K_M

verification:
  nli_model: MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7
  nli_challengers: [MoritzLaurer/bge-m3-zeroshot-v2.0]
  nei_ratio_threshold: 0.3

evaluation:
  bootstrap_samples: 1000
  ci: 0.95
  human_verified_min: 3000
  real_docs_min: 50

promotion:                  # ADR-0009, architecture §10
  ner_kk_f1_min_gain: 0.03
  ner_other_max_drop: 0.01
  retrieval_no_direction_worse: true
  faithfulness_min: 0.85
  worst_direction_max_gap: 0.10
  e2e_p95_latency_s: 6.0

cloud:                      # ADR-0014; provider chosen in stage 1
  dvc_remote: cloud
  budget_usd: 0             # must be set and approved before any cloud run
