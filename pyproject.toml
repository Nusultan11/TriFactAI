[project]
name = "trifact"
version = "0.1.0"
description = "TriFact AI: multilingual (KK/RU/EN) document and knowledge intelligence platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
serving = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "qdrant-client>=1.12",
    "arq>=0.26",
    "boto3>=1.35",
    "prometheus-client>=0.20",
    "openai>=1.50",
]
ingestion = [
    "docling>=2.10",
    "fasttext-predict>=0.9.2.4",  # predict-only fastText; fasttext-wheel breaks on numpy 2
    "dateparser>=1.2",
]
ml = [
    "torch>=2.4",
    "transformers>=4.57",   # Qwen3.5 (qwen3_5) support, ADR-0012
    "datasets>=3.0",
    "peft>=0.13",
    "bitsandbytes>=0.44",
    "accelerate>=1.0",
    "sentence-transformers>=3.2",
    "FlagEmbedding>=1.3",
    "gliner>=0.2.13",
    "mlflow>=3.5",
    "dvc[s3]>=3.55",
    "huggingface-hub>=0.34",
    "indexed-bzip2>=1.6",
    "orjson>=3.10",
    "psutil>=6",
    "polars>=1.30",
    "duckdb>=1.3",
    "pyarrow>=20",
    "scipy>=1.14",            # connected components of MinHash clusters (stage 2)
    "tokenizers>=0.21",       # tokenizer fertility in corpus stats (stage 2)
    "optuna>=4.0",
    "onnxruntime>=1.20",
    "pandera[polars]>=0.20",
    "seqeval>=1.2.2",
    "ranx>=0.3.20",
    "fasttext-predict>=0.9.2.4",  # language id in curation (stage 2)
]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pre-commit>=4", "types-PyYAML>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trifact"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
